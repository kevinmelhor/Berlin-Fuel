<style>
  :root{
    --paper:#fff;--ink:#1e293b;--muted:#64748b;--faint:#94a3b8;--line:#e6ebf1;
    --accent:#3f5b7c;--deep:#2f4a68;--tint:#eef2f7;--badge:#e7eef5;--done:#16a34a;
    --carb:#b45309;--carbbg:#fdf3e3;--port:#0e7490;--portbg:#e8f6f9;
    --her:#8b5a83;--herbg:#f7eef6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:#eef1f5;line-height:1.45;padding-bottom:44px;}
  header{position:sticky;top:0;z-index:20;background:var(--deep);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 0;box-shadow:0 2px 10px rgba(0,0,0,.12);}
  .htop{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  h1{font-size:16px;margin:0;font-weight:800;}
  .hbtns{display:flex;gap:6px;}
  .hbtn{background:rgba(255,255,255,.14);color:#fff;border:none;border-radius:8px;font-size:11.5px;font-weight:700;padding:6px 10px;cursor:pointer;}
  .prog{margin-top:8px;}
  .progbar{height:6px;background:rgba(255,255,255,.18);border-radius:20px;overflow:hidden;}
  .progfill{height:100%;background:#7fd39b;width:0;transition:width .3s;}
  .progtxt{font-size:11px;color:#cdd9e6;margin-top:4px;display:flex;justify-content:space-between;}
  .tabs{display:flex;margin-top:10px;}
  .tab{flex:1;text-align:center;font-size:13px;font-weight:800;color:#9fb3c8;padding:10px 0 11px;border-bottom:3px solid transparent;cursor:pointer;}
  .tab.on{color:#fff;border-bottom-color:#7fd39b;}
  .wrap{max-width:660px;margin:0 auto;padding:12px 12px 0;}
  .legend{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-size:12px;color:var(--muted);margin-bottom:6px;}
  .legend b{color:var(--deep);}
  .legend.her b{color:var(--her);}

  .wkhead{display:flex;align-items:baseline;border-left:4px solid var(--accent);padding:2px 0 4px 10px;margin:16px 0 8px;}
  .her .wkhead{border-left-color:var(--her);}
  .wkno{font-size:13.5px;font-weight:800;margin-right:9px;}
  .wkdates{font-size:11.5px;font-weight:600;}
  .wkmenu{margin-left:auto;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--accent);}
  .her .wkmenu{color:var(--her);}

  .card{background:#fff;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;overflow:hidden;}
  .crow{display:flex;align-items:center;padding:11px 12px;cursor:pointer;gap:11px;}
  .cbox{width:25px;height:25px;min-width:25px;border:2px solid var(--faint);border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .cbox svg{width:14px;height:14px;opacity:0;}
  .cmeta{flex:1;min-width:0;}
  .cdate{font-size:11px;color:var(--muted);}
  .ctitle{font-size:14px;font-weight:700;margin-top:1px;}
  .csub{font-size:11px;color:var(--muted);margin-top:1px;}
  .tag{font-size:9.5px;font-weight:800;border-radius:20px;padding:3px 9px;white-space:nowrap;background:var(--badge);color:var(--deep);}
  .tag.carb{background:var(--carbbg);color:var(--carb);}
  .tag.long{background:var(--deep);color:#fff;}
  .tag.port{background:var(--portbg);color:var(--port);}
  .tag.race{background:#7f1d1d;color:#fff;}
  .tag.her{background:var(--herbg);color:var(--her);}
  .chev{color:var(--faint);font-size:13px;transition:transform .2s;}
  .card.open .chev{transform:rotate(90deg);}
  .body{max-height:0;overflow:hidden;transition:max-height .3s ease;padding:0 12px;}
  .card.open .body{max-height:3000px;padding-bottom:12px;}
  .meal{border-top:1px dashed var(--line);padding:8px 0 2px;}
  .mname{font-size:12px;font-weight:800;color:var(--deep);text-transform:uppercase;letter-spacing:.04em;}
  .her .mname{color:var(--her);}
  .mitem{font-size:12.5px;color:#475569;margin:3px 0 3px 2px;}
  .mac{font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums;}
  .total{border-top:2px solid var(--line);margin-top:9px;padding-top:8px;font-size:12px;font-weight:800;color:var(--deep);display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;}
  .her .total{color:var(--her);}
  .total span.t2{font-weight:600;color:var(--muted);}
  .gnote{font-size:12px;color:#475569;margin:6px 0;}
  .card.today{box-shadow:0 0 0 2px var(--accent);}
  .her .card.today{box-shadow:0 0 0 2px var(--her);}
  .todaytag{display:inline-block;font-size:9px;font-weight:800;background:var(--accent);color:#fff;border-radius:5px;padding:2px 6px;margin-left:6px;vertical-align:1px;}
  .card.done{opacity:.6;}
  .card.done .ctitle{text-decoration:line-through;color:var(--faint);}
  .card.done .cbox{background:var(--done);border-color:var(--done);}
  .card.done .cbox svg{opacity:1;}

  .card.shop{background:#f6f9f6;border-color:#d9e8d9;}
  .shopgrp{font-size:11px;font-weight:800;color:#3a6b4a;text-transform:uppercase;letter-spacing:.06em;margin:10px 0 3px;}
  .shopgrp.cost{color:#b45309;}
  .sitem{display:flex;align-items:flex-start;gap:9px;padding:6px 0;border-bottom:1px solid #e6efe6;font-size:13px;color:#374151;cursor:pointer;}
  .sitem:last-child{border-bottom:none;}
  .sbox{width:21px;height:21px;min-width:21px;border:2px solid #9db8a4;border-radius:6px;background:#fff;margin-top:1px;display:flex;align-items:center;justify-content:center;}
  .sbox svg{width:12px;height:12px;opacity:0;}
  .sitem .qty{color:#7a8a80;font-size:11.5px;display:block;}
  .sitem.done{color:#9aa8a0;text-decoration:line-through;}
  .sitem.done .sbox{background:var(--done);border-color:var(--done);}
  .sitem.done .sbox svg{opacity:1;}
  .foot{font-size:11px;color:var(--faint);text-align:center;padding:18px 12px 0;line-height:1.6;}
  .hidden{display:none;}

  /* ---- Fuel tab (day / drow / fuel system, distinct from .card) ---- */
  .day{background:var(--paper);border:1px solid var(--line);border-radius:11px;margin-bottom:8px;overflow:hidden;}
  .day.long{background:var(--tint);border-color:#d9e2ec;}
  .day.rest{background:#fafbfc;}
  .day.wake{border-color:var(--accent);border-width:1.5px;}
  .day.race{background:var(--deep);border-color:var(--deep);}
  .drow{display:flex;align-items:center;padding:11px 12px;cursor:pointer;gap:11px;}
  .dmeta{flex:1;min-width:0;}
  .ddate{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .dsess{font-size:14px;font-weight:700;color:var(--ink);margin-top:1px;}
  .gel{font-size:10px;font-weight:800;color:var(--deep);background:var(--badge);border-radius:20px;padding:4px 9px;white-space:nowrap;}
  .day.open .chev{transform:rotate(90deg);}
  .fuel{max-height:0;overflow:hidden;transition:max-height .25s ease;padding:0 12px;}
  .day.open .fuel{max-height:400px;padding-bottom:11px;}
  .fuel .row{display:flex;gap:8px;font-size:12.5px;color:#475569;margin:3px 0;padding-left:37px;}
  .fuel .lbl{font-weight:800;color:var(--deep);min-width:48px;}
  .fuel .note{font-size:12.5px;color:#64748b;font-style:italic;padding-left:37px;margin:2px 0;}
  .day.today{box-shadow:0 0 0 2px var(--accent);}
  .day.done .dsess{text-decoration:line-through;color:var(--faint);}
  .day.done{opacity:.62;}
  .day.done .cbox{background:var(--done);border-color:var(--done);}
  .day.done .cbox svg{opacity:1;}
  .day.done.hide{display:none;}
  .day.race .ddate{color:#b8c6d6;}
  .day.race .dsess{color:#fff;}
  .day.race .fuel .row{color:#dbe6f1;}
  .day.race .fuel .lbl{color:#fff;}
  .day.race .gel{background:#fff;color:var(--deep);}
  .day.race .cbox{border-color:#fff;}
  .day.race.done .dsess{color:#9fb3c8;}
  .a2hs{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:4px 0 12px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:10px;}
  .a2hs b{color:var(--deep);}
  .a2hs button{margin-left:auto;background:none;border:none;color:var(--faint);font-size:18px;cursor:pointer;padding:0 4px;}
  .fuellink{font-size:10.5px;color:var(--deep);background:#eef2f7;border:1px dashed #c7d3e0;border-radius:7px;padding:5px 9px;margin:6px 0 0 32px;display:inline-block;}

function computeWeekTally(wk){
  if(!MENUS[wk.menu]) return null;
  const menu=wk.menu;
  let chickenG=0, chiliLunchK=0, chiliDinnerK=0, chiliDinnerC=0, riceCups=0, strCount=0;
  const fresh=[];
  wk.days.forEach(d=>{
    const [id,l,run,t,dow]=d;
    if(t==="STR") strCount++;
    const ks=kevinMeals(t,dow,menu);
    if(!ks) return;
    if(ks.includes("lChx")){chickenG+=140; riceCups+=1;}
    if(ks.includes("lCarb")){chickenG+=113; riceCups+=1.5;}
    if(ks.includes("lChili")){chiliLunchK+=2; riceCups+=0.5;}
    const dinnerKey=(t==="CARB")?"dPasta":MENUS[menu].din[dow];
    if(dinnerKey==="dChili"){chiliDinnerK+=2.5; riceCups+=0.5;}
    else if(dinnerKey==="dStir"){riceCups+=1; fresh.push({day:l,...FRESH.dStir});}
    else if(dinnerKey==="dSalmon"){riceCups+=1; fresh.push({day:l,...FRESH.dSalmon});}
    else if(dinnerKey==="dTaco"){riceCups+=0.5; fresh.push({day:l,...FRESH.dTaco});}
    else if(FRESH[dinnerKey]) fresh.push({day:l,...FRESH[dinnerKey]});
    const cs=claudiaMeals(t,dow,menu);
    if(cs && cs!=="race" && dinnerKey==="dChili") chiliDinnerC+=1.5;
  });
  const eggs=strCount*3+6;
  return {chickenG,chiliLunchK,chiliDinnerK,chiliDinnerC,riceCups,eggs,fresh};
}

  if(done[dkey])el.classList.add("done");
  if(id===TID)el.classList.add("today","open");
  const tagCls=(who==="c")?"her":((t==="CARB")?"carb":(t==="LONG")?"long":(t==="PORT"||t==="BER")?"port":(t==="RACE")?"race":"");
  const tagTxt=(who==="c")?"MEAL PLAN":({EASY:"EASY",QUAL:"QUALITY",STR:"STRENGTH",REST:"REST",CARB:"CARB LOAD",LONG:"LONG RUN",PORT:"PORTUGAL",BER:"BERLIN",RACE:"RACE DAY"})[t];
  let body="";
  const fuelMatch=FUEL_BY_DATE[id];
  const RUN_TYPES=["EASY","QUAL","CARB","LONG"];
  function snackBlockHTML(lib,key){
    if(!key||!lib[key]) return "";
    const sm=lib[key];
    let h='<div class="meal" style="opacity:.8"><div class="mname">'+sm.n+'</div>';
    sm.it.forEach(x=>{h+='<div class="mitem">'+x[0]+' <span class="mac">'+(x[1]||"")+'</span></div>';});
    h+='<div class="note">Optional — not counted in the total above. Have one only if you\'re still hungry.</div></div>';
    return h;
  }
  if(who==="k"){
    const ks=kevinMeals(t,dow,menu);
    if(ks){
      const bfKey=ks.find(k=>k.startsWith("bf"));
      const snackKey=ks.find(k=>k==="sOpt");
      const restKeys=ks.filter(k=>k!==bfKey&&k!==snackKey);
      let tot=[0,0,0,0], bfHTML="";
      if(bfKey && KM[bfKey]){
        const bm=KM[bfKey];
        tot=[tot[0]+bm.m[0],tot[1]+bm.m[1],tot[2]+bm.m[2],tot[3]+bm.m[3]];
        if(RUN_TYPES.includes(t) && fuelMatch && fuelMatch.f && fuelMatch.f.b){
          bfHTML='<div class="meal"><div class="mname">Breakfast — before &amp; after your run</div>'
            +'<div class="mitem"><b>Before:</b> '+fuelMatch.f.b+'</div>'
            +(fuelMatch.f.a?'<div class="mitem"><b>After:</b> '+fuelMatch.f.a+'</div>':'')
            +'<div class="mac">'+bm.m[0]+' cal · '+bm.m[1]+'g P · '+bm.m[2]+'g C · '+bm.m[3]+'g F</div></div>';
        }else{
          bfHTML=mealHTML(KM,[bfKey]).html;
        }
      }
      const rest=mealHTML(KM,restKeys);
      tot=[tot[0]+rest.tot[0],tot[1]+rest.tot[1],tot[2]+rest.tot[2],tot[3]+rest.tot[3]];
      body=bfHTML+rest.html+'<div class="total"><span>'+Math.round(tot[0])+' cal · '+Math.round(tot[1])+'g P · '+Math.round(tot[2])+'g C · '+Math.round(tot[3])+'g F</span><span class="t2">'+KTARGET[t]+'</span></div>';
      if(RUN_TYPES.includes(t) && fuelMatch && fuelMatch.f && fuelMatch.f.d){
        body+='<div class="gnote"><b>During the run:</b> '+fuelMatch.f.d+'</div>';
      }
      body+=snackBlockHTML(KM,snackKey);
    }
    else if(t==="RACE"){
      if(fuelMatch && fuelMatch.f){
        body='<div class="meal"><div class="mname">Race morning — before the gun</div><div class="mitem">'+fuelMatch.f.b+'</div></div>'
          +'<div class="gnote"><b>During the race:</b> '+fuelMatch.f.d+'</div>'
          +'<div class="meal"><div class="mname">After you finish</div><div class="mitem">'+fuelMatch.f.a+'</div></div>';
      }else{
        body='<div class="gnote">Race breakfast 2.5 to 3 hr before, 8 gels every 30 min (4 reg then 4 caf), celebrate after.</div>';
      }
    }
    else{body='<div class="gnote">Eat out, protein first. Guide is on this week\'s Shopping tab.</div>';}
  }else{
    const cs=claudiaMeals(t,dow,menu);
    if(cs==="race"){body='<div class="gnote">Cheer loud, eat well, celebrate Kevin at the finish. Back to plan Monday.</div>';}
    else if(cs){
      const snackKey=cs.find(k=>k==="cSnkOpt");
      const coreKeys=cs.filter(k=>k!==snackKey);
      const r=mealHTML(CM,coreKeys);
      body=r.html+'<div class="total"><span>'+Math.round(r.tot[0])+' cal · '+Math.round(r.tot[1])+'g P · '+Math.round(r.tot[2])+'g C · '+Math.round(r.tot[3])+'g F</span><span class="t2">'+CTARGET+'</span></div>';
      body+=snackBlockHTML(CM,snackKey);
    }
    else{body='<div class="gnote">Eating out: protein first, vegetables over bread and rice, yogurt breakfasts. Guide on the Shopping tab.</div>';}
  }
  const runLine=(who==="c")?l.split(" ").slice(0,2).join(" ")+" plan":run;
  el.innerHTML='<div class="crow"><div class="cbox">'+CHK+'</div><div class="cmeta"><div class="cdate">'+l+(id===TID?'<span class="todaytag">TODAY</span>':"")+'</div><div class="ctitle">'+(who==="k"?run:"Daily plan")+'</div></div><span class="tag '+tagCls+'">'+tagTxt+'</span><span class="chev">&#9654;</span></div><div class="body">'+body+'</div>';
  el.querySelector(".crow").addEventListener("click",e=>{if(e.target.closest(".cbox"))return;el.classList.toggle("open");});
  el.querySelector(".cbox").addEventListener("click",e=>{e.stopPropagation();
    if(done[dkey])delete done[dkey];else done[dkey]=true;save();el.classList.toggle("done");updateProg();});
  return el;
}
function shopCard(wi,wk){
  const el=document.createElement("div");el.className="card shop";
  let inner='<div class="crow"><div class="cmeta"><div class="cdate">Shop Sunday '+wk.dates.split(" to ")[0]+'</div><div class="ctitle">🛒 '+wk.label+' shopping</div></div><span class="chev">&#9654;</span></div><div class="body">';
  if(MENUS[wk.menu]){
    const s=SHOP[wk.menu];
    inner+='<div class="shopgrp">ShopRite, weekly</div>';
    s.sr.forEach((it,ii)=>{const iid="s_"+wi+"_sr_"+ii;
      inner+='<div class="sitem'+(done[iid]?" done":"")+'" data-sid="'+iid+'"><span class="sbox">'+CHK+'</span><span>'+it[0]+'<span class="qty">'+it[1]+'</span></span></div>';});
    inner+='<div class="shopgrp cost">Costco, stock up every 2 to 3 weeks</div>';
    s.co.forEach((it,ii)=>{const iid="s_"+wi+"_co_"+ii;
      inner+='<div class="sitem'+(done[iid]?" done":"")+'" data-sid="'+iid+'"><span class="sbox">'+CHK+'</span><span>'+it[0]+'<span class="qty">'+it[1]+'</span></span></div>';});
    inner+='<div class="shopgrp">Sunday prep</div>';
    PREP[wk.menu].forEach((p,pi)=>{const iid="s_"+wi+"_p_"+pi;
      inner+='<div class="sitem'+(done[iid]?" done":"")+'" data-sid="'+iid+'"><span class="sbox">'+CHK+'</span><span>'+p+'</span></div>';});
  }else{
    const g=(wk.menu==="PORT")?PORT_GUIDE:BER_GUIDE;
    inner+='<div class="shopgrp">'+(wk.menu==="PORT"?"Portugal eating guide":"Berlin eating guide")+'</div>';
    g.forEach(x=>{inner+='<div class="meal"><div class="mname">'+x[0]+'</div><div class="mitem">'+x[1]+'</div></div>';});
  }
  inner+='</div>';el.innerHTML=inner;
  el.querySelector(".crow").addEventListener("click",()=>el.classList.toggle("open"));
  el.querySelectorAll(".sitem").forEach(s=>{s.addEventListener("click",e=>{e.stopPropagation();const id=s.dataset.sid;
    if(done[id])delete done[id];else done[id]=true;save();s.classList.toggle("done");});});
  return el;
}
function wkHead(wk,extra){
  const wh=document.createElement("div");wh.className="wkhead";
  wh.innerHTML='<span class="wkno">'+wk.label+'</span><span class="wkdates">'+wk.dates+'</span><span class="wkmenu">'+(MENUS[wk.menu]?("Menu "+wk.menu):(wk.menu==="PORT"?"Portugal":"Race week"))+'</span>';
  return wh;
}
function render(){
  const pk=document.getElementById("pane-kevin"),pc=document.getElementById("pane-claudia"),pp=document.getElementById("pane-prep"),ps=document.getElementById("pane-shopping");
  pk.innerHTML='<div class="legend"><b>Kevin:</b> normal days 2,300 to 2,500 cal, 150g+ protein. Carb load Fridays 350g+ carbs. Long run Saturdays about 2,900, eat it all. Breakfast doubles as your before and after run fuel on training days; during-run gels and LMNT are noted separately below.</div>';
  pc.innerHTML='<div class="legend her"><b>Claudia:</b> about 1,450 to 1,550 cal, 120g+ protein, carbs limited, fiber 25g+, iron built in (beef, lentils, spinach). Same dinners as Kevin, her portions. No training plan, meals only. Confirm targets with your doctor.</div>';
  pp.innerHTML='<div class="legend"><b>Sunday prep:</b> exact batch recipes, quantities, and portioning for the week, plus which dinners are cooked fresh on the night rather than prepped ahead.</div>';
  ps.innerHTML='<div class="legend"><b>Shopping:</b> ShopRite list is weekly. Costco section is a stock up run every 2 to 3 weeks, check levels before going. Tap items off in the store. Sunday prep now has its own tab.</div>';
  WEEKS.forEach((wk,wi)=>{
    pk.appendChild(wkHead(wk));pc.appendChild(wkHead(wk));pp.appendChild(wkHead(wk));ps.appendChild(wkHead(wk));
    pp.appendChild(buildPrepCard(wi,wk));
    ps.appendChild(shopCard(wi,wk));
    wk.days.forEach(d=>{pk.appendChild(dayCard("k",d,wk.menu,"k"));pc.appendChild(dayCard("c",d,wk.menu,"c"));});
  });
  updateProg();
}
let TAB="kevin";
const hideState={kevin:false,claudia:false};
function applyHideTab(tab){
  document.querySelectorAll("#pane-"+tab+" .card.done").forEach(d=>d.classList.toggle("hide",hideState[tab]));
}
function updateProg(){
  if(TAB==="shopping"||TAB==="prep"){document.getElementById("pt").textContent=TAB==="prep"?"Tap a week to see Sunday's recipes":"Tap items off as you shop";document.getElementById("pf").style.width="0%";return;}
  const who=TAB==="claudia"?"c":"k";
  let total=0;WEEKS.forEach(w=>total+=w.days.length);
  const n=Object.keys(done).filter(k=>k.startsWith(who+"_")&&done[k]).length;
  document.getElementById("pf").style.width=(total?(n/total*100):0)+"%";
  document.getElementById("pt").textContent=n+" of "+total+" days done ("+(TAB==="claudia"?"Claudia":"Kevin")+")";
}
document.querySelectorAll(".tab").forEach(t=>{t.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));t.classList.add("on");
  TAB=t.dataset.tab;
  ["kevin","claudia","prep","shopping"].forEach(p=>{document.getElementById("pane-"+p).classList.toggle("hidden",p!==TAB);});
  const hideBtn=document.getElementById("hideBtn");
  hideBtn.style.display=(TAB==="prep"||TAB==="shopping")?"none":"";
  if(hideState[TAB]!==undefined) hideBtn.textContent=hideState[TAB]?"Show all":"Hide done";
  updateProg();
});});
document.getElementById("todayBtn").addEventListener("click",()=>{
  const pane=document.getElementById("pane-"+((TAB==="shopping"||TAB==="prep")?"kevin":TAB));
  const t=pane.querySelector(".card.today");
  if(t){t.classList.add("open");t.scrollIntoView({behavior:"smooth",block:"center"});}
  else alert("The plan runs Jul 12 to Sep 27.");
});
document.getElementById("hideBtn").addEventListener("click",function(){
  if(hideState[TAB]===undefined) return;
  hideState[TAB]=!hideState[TAB];
  this.textContent=hideState[TAB]?"Show all":"Hide done";
  applyHideTab(TAB);
});
document.getElementById("resetBtn").addEventListener("click",()=>{
  if(TAB==="kevin"||TAB==="claudia"){
    const prefix=(TAB==="claudia"?"c_":"k_");
    if(confirm("Clear "+(TAB==="claudia"?"Claudia's":"Kevin's")+" checkmarks on this tab?")){
      Object.keys(done).filter(k=>k.startsWith(prefix)).forEach(k=>delete done[k]);
      save();render();
    }
    return;
  }
  if(TAB==="shopping"){
    if(confirm("Clear all shopping checkmarks?")){
      Object.keys(done).filter(k=>k.startsWith("s_")).forEach(k=>delete done[k]);
      save();render();
    }
    return;
  }
});
document.getElementById("a2hsClose").addEventListener("click",()=>{
  document.getElementById("a2hs").style.display="none";
  try{localStorage.setItem("bfc_a2hs","1");}catch(e){}
});
if(localStorage.getItem("bfc_a2hs")||window.navigator.standalone){
  document.getElementById("a2hs").style.display="none";
}
document.getElementById("footnote").textContent="Macros are close estimates, log actuals in MyFitnessPal. Chobani = Complete shake. Orgain = 2 scoops. Claudia's targets are estimates, confirm with her doctor.";
render();
window.addEventListener("load",()=>{const t=document.querySelector("#pane-kevin .card.today");if(t)setTimeout(()=>t.scrollIntoView({behavior:"smooth",block:"center"}),200);});
</script>
</body>
</html>
